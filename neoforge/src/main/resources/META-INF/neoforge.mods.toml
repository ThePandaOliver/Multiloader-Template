modLoader = "javafml"
loaderVersion = "*"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors_forge}"
description = "${mod_description}"
logoFile = "assets/${mod_id}/icon.png"
logoBlur = false

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_loader_version},)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "${mod_id}-common.mixins.json"

[[mixins]]
config = "${mod_id}-neoforge.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"